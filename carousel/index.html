<!DOCTYPE html>
<html lang="en-us">

<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <meta name="color-scheme" content="light dark">
  <title>Summer Camp Schedule &mdash; International Dance</title>
  <link rel="stylesheet" href="carousel.css">
</head>

<body>
  <main>
    <article>
      <header>
        <h1>Summer Camp</h1>
        <p>Swipe, scroll, or use the arrows to move through the week.</p>
        <nav aria-label="Jump to a section of the schedule">
          <ul>
            <li><a href="#instructors">Instructors</a></li>
            <li><a href="#staff">Staff</a></li>
          </ul>
        </nav>
      </header>

      <section tabindex="0" aria-label="Summer camp schedule, day by day">
        <figure id="day-1">
          <img src="../assets/images/promo/promo_01.webp"
            alt="A dancer en pointe in a gold and red costume on a darkened stage, two dancers seated behind her.">
          <figcaption><a href="#day-1">Warm-Up &amp; Foundations</a></figcaption>
        </figure>

        <figure id="day-2">
          <img src="../assets/images/promo/promo_07.webp"
            alt="Dancers with arms raised mid-routine on a basketball court during a half-time performance.">
          <figcaption><a href="#day-2">Waltz &amp; Foxtrot</a></figcaption>
        </figure>

        <figure id="day-3">
          <img src="../assets/images/promo/promo_12.jpg"
            alt="A line of dancers in blue and violet tutus holding a pose on a blue-lit stage.">
          <figcaption><a href="#day-3">Cha-Cha &amp; Rumba</a></figcaption>
        </figure>

        <figure id="day-4">
          <img src="../assets/images/promo/promo_18.jpg"
            alt="Dancers in pastel ballgowns circling a soloist beneath warm string lights.">
          <figcaption><a href="#day-4">Swing &amp; Lindy Hop</a></figcaption>
        </figure>

        <figure id="day-5">
          <img src="../assets/images/promo/promo_24.jpg"
            alt="The company taking a curtain call while a director speaks into a microphone.">
          <figcaption><a href="#day-5">Tango Intensive</a></figcaption>
        </figure>

        <figure id="day-6">
          <img src="../assets/images/promo/promo_33.webp"
            alt="Dancers in tutus and crowns leaping in unison for a studio portrait.">
          <figcaption><a href="#day-6">Showcase Choreography</a></figcaption>
        </figure>

        <figure id="day-7">
          <img src="../assets/images/promo/promo_34.webp"
            alt="Dancers in dark red velvet costumes grouped around an American flag for a studio portrait.">
          <figcaption><a href="#day-7">Social &amp; Showcase Night</a></figcaption>
        </figure>

        <figure id="instructors">
          <img src="../assets/images/staff/b.jpg" alt="Studio headshot of a smiling camp instructor.">
          <figcaption><a href="#instructors">Instructors</a></figcaption>
        </figure>

        <figure id="staff">
          <img src="../assets/images/staff/k.jpg" alt="Studio headshot of a smiling member of the camp staff.">
          <figcaption><a href="#staff">Staff</a></figcaption>
        </figure>
      </section>
    </article>
  </main>
</body>

</html>
