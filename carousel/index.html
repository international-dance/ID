<!DOCTYPE html>
<html lang="en-us">

<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <meta name="color-scheme" content="light dark">
  <title>Instructors &amp; Staff &mdash; International Dance</title>
  <link rel="stylesheet" href="carousel.css">
</head>

<body>
  <main>
    <article>
      <header>
        <h1>Instructors &amp; Staff</h1>
        <p>Swipe, scroll, or use the arrows to meet the team.</p>

        <nav aria-label="Jump to a group">
          <ul>
            <li><a href="#instructor-1">Instructors</a></li>
            <li><a href="#staff-1">Staff</a></li>
          </ul>
        </nav>

        <label>
          <input type="checkbox" name="autoplay" checked>
          Auto-advance
        </label>

      </header>

      <section tabindex="0" aria-label="Instructors and staff">
        <figure id="instructor-1">
          <img src="/assets/images/carousel/01.webp" alt="Portrait of the ballet instructor.">
          <figcaption>
            <a href="#instructor-1">Name Placeholder</a>
            <small>Ballet</small>
            <p>Classical technique and pointe for every level, from first position to variations.</p>
            <a href="/about#instructor-1">Full bio</a>
          </figcaption>
        </figure>

        <figure id="instructor-2">
          <img src="/assets/images/carousel/02.webp" alt="Portrait of the ballroom instructor.">
          <figcaption>
            <a href="#instructor-2">Name Placeholder</a>
            <small>Ballroom</small>
            <p>Smooth and standard, with a soft spot for the slow foxtrot.</p>
            <a href="/about#instructor-2">Full bio</a>
          </figcaption>
        </figure>

        <figure id="instructor-3">
          <img src="/assets/images/carousel/03.webp" alt="Portrait of the latin instructor.">
          <figcaption>
            <a href="#instructor-3">Name Placeholder</a>
            <small>Latin</small>
            <p>Cha-cha, rumba and samba, taught with a metronome and a lot of patience.</p>
            <a href="/about#instructor-3">Full bio</a>
          </figcaption>
        </figure>

        <figure id="instructor-4">
          <img src="/assets/images/carousel/04.webp" alt="Portrait of the swing instructor.">

            <a href="#instructor-4">Name Placeholder</a>

            <p>Lindy hop and east coast swing, social-floor ready in six weeks.</p>
            <a href="/about#instructor-4">Full bio</a>
          </figcaption>
        </figure>

        <figure id="instructor-5">
          <img src="/assets/images/carousel/05.webp" alt="Portrait of the tango instructor.">
          <figcaption>
            <a href="#instructor-5">Name Placeholder</a>
            <small>Tango</small>
            <p>Argentine tango, close embrace, musicality before figures.</p>
            <a href="/about#instructor-5">Full bio</a>
          </figcaption>
        </figure>

        <figure id="staff-1">
          <img src="/assets/images/carousel/06.webp" alt="Portrait of the studio manager staff member.">
          <figcaption>
            <a href="#staff-1">Name Placeholder</a>
            <small>Studio Manager</small>
            <p>Runs the schedule, the studios and everything that keeps a term on the rails.</p>
            <a href="/about#staff-1">Full bio</a>
          </figcaption>
        </figure>

        <figure id="staff-2">
          <img src="/assets/images/carousel/07.webp" alt="Portrait of the front desk staff member.">
          <figcaption>
            <a href="#staff-2">Name Placeholder</a>
            <small>Front Desk</small>
            <p>First face at the door, and the one who finds your lost shoe.</p>
            <a href="/about#staff-2">Full bio</a>
          </figcaption>
        </figure>

        <figure id="staff-3">
          <img src="/assets/images/carousel/08.webp" alt="Portrait of the costume shop staff member.">
          <figcaption>
            <a href="#staff-3">Name Placeholder</a>
            <small>Costume Shop</small>
            <p>Fits, alters and repairs every costume that makes it to the stage.</p>
            <a href="/about#staff-3">Full bio</a>
          </figcaption>
        </figure>

        <figure id="staff-4">
          <img src="/assets/images/carousel/09.webp" alt="Portrait of the stage crew staff member.">
          <figcaption>
            <a href="#staff-4">Name Placeholder</a>

          </figcaption>
