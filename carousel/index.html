<!DOCTYPE html>
<html lang="en-us">

<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <meta name="color-scheme" content="light dark">
  <title>Instructors &amp; Staff &mdash; International Dance</title>
  <link rel="stylesheet" href="carousel.css">
</head>

<body>
  <main>
    <article>
      <header>
        <h1>Instructors &amp; Staff</h1>
        <p>Swipe, scroll, or use the arrows to meet the team.</p>

        <nav aria-label="Jump to a group">
          <ul>
            <li><a href="#instructor-1">Instructors</a></li>
            <li><a href="#staff-1">Staff</a></li>
          </ul>
        </nav>

        <label>
          <input type="checkbox" name="autoplay" checked>
          Auto-advance
        </label>

        <label>
          <input type="checkbox" name="dots" checked>
          Dots
        </label>
      </header>

      <section tabindex="0" aria-label="Instructors and staff">
        <figure id="instructor-1">
          <img src="/assets/images/carousel/01.webp" alt="Portrait of the ballet instructor.">
          <figcaption><a href="#instructor-1">Ballet</a></figcaption>
        </figure>

        <figure id="instructor-2">
          <img src="/assets/images/carousel/02.webp" alt="Portrait of the ballroom instructor.">
          <figcaption><a href="#instructor-2">Ballroom</a></figcaption>
        </figure>

        <figure id="instructor-3">
          <img src="/assets/images/carousel/03.webp" alt="Portrait of the Latin instructor.">
          <figcaption><a href="#instructor-3">Latin</a></figcaption>
        </figure>

        <figure id="instructor-4">
          <img src="/assets/images/carousel/04.webp" alt="Portrait of the swing instructor.">
          <figcaption><a href="#instructor-4">Swing</a></figcaption>
        </figure>

        <figure id="instructor-5">
          <img src="/assets/images/carousel/05.webp" alt="Portrait of the tango instructor.">
          <figcaption><a href="#instructor-5">Tango</a></figcaption>
        </figure>

        <figure id="staff-1">
          <img src="/assets/images/carousel/06.webp" alt="Portrait of the studio manager.">
          <figcaption><a href="#staff-1">Studio Manager</a></figcaption>
        </figure>

        <figure id="staff-2">
          <img src="/assets/images/carousel/07.webp" alt="Portrait of the front desk coordinator.">
          <figcaption><a href="#staff-2">Front Desk</a></figcaption>
        </figure>

        <figure id="staff-3">
          <img src="/assets/images/carousel/08.webp" alt="Portrait of the costume shop lead.">
          <figcaption><a href="#staff-3">Costume Shop</a></figcaption>
        </figure>

        <figure id="staff-4">
          <img src="/assets/images/carousel/09.webp" alt="Portrait of the stage crew lead.">
          <figcaption><a href="#staff-4">Stage Crew</a></figcaption>
        </figure>
      </section>
    </article>
  </main>
</body>

</html>
