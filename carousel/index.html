<!DOCTYPE html>
<html lang="en-us">

<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <meta name="color-scheme" content="light dark">
  <title>Summer Camp Schedule &mdash; International Dance</title>
  <link rel="stylesheet" href="carousel.css">
</head>

<body>
  <main>
    <article>
      <header>
        <h1>Summer Camp</h1>
        <p>Swipe, scroll, or use the arrows to move through the week.</p>
        <nav aria-label="Jump to a section of the schedule">
          <ul>
            <li><a href="#day-1">Instructors</a></li>
            <li><a href="#day-5">Staff</a></li>
          </ul>
        </nav>
      </header>

      <section tabindex="0" aria-label="Summer camp schedule, day by day">
        <figure id="day-1" data-label="Day 1, Warm-Up and Foundations">
          <img src="/assets/images/carousel/01.webp"
            alt="Dancers at the barre during the warm-up session.">
          <figcaption><a href="#day-1">Warm-Up &amp; Foundations</a></figcaption>
        </figure>

        <figure id="day-2" data-label="Day 2, Waltz and Foxtrot">
          <img src="/assets/images/carousel/02.webp"
            alt="A couple in closed hold during a waltz class.">
          <figcaption><a href="#day-2">Waltz &amp; Foxtrot</a></figcaption>
        </figure>

        <figure id="day-3" data-label="Day 3, Cha-Cha and Rumba">
          <img src="/assets/images/carousel/03.webp"
            alt="Dancers practising Latin footwork.">
          <figcaption><a href="#day-3">Cha-Cha &amp; Rumba</a></figcaption>
        </figure>

        <figure id="day-4" data-label="Day 4, Swing and Lindy Hop">
          <img src="/assets/images/carousel/04.webp"
            alt="Partners mid-swing on the studio floor.">
          <figcaption><a href="#day-4">Swing &amp; Lindy Hop</a></figcaption>
        </figure>

        <figure id="day-5" data-label="Day 5, Tango Intensive">
          <img src="/assets/images/carousel/05.webp"
            alt="A tango couple in a deep corte.">
          <figcaption><a href="#day-5">Tango Intensive</a></figcaption>
        </figure>

        <figure id="day-6" data-label="Day 6, Showcase Choreography">
          <img src="/assets/images/carousel/06.webp"
            alt="The full class running showcase choreography.">
          <figcaption><a href="#day-6">Showcase Choreography</a></figcaption>
        </figure>

        <figure id="day-7" data-label="Day 7, Social and Showcase Night">
          <img src="/assets/images/carousel/07.webp"
            alt="Dancers celebrating on stage at the showcase.">
          <figcaption><a href="#day-7">Social &amp; Showcase Night</a></figcaption>
        </figure>

        <figure id="instructors" data-label="Instructors">
          <img src="/assets/images/carousel/08.webp"
            alt="The camp's instructors.">
          <figcaption><a href="#instructors">Instructors</a></figcaption>
        </figure>

        <figure id="staff" data-label="Staff">
          <img src="/assets/images/carousel/09.webp"
            alt="The camp's support staff.">
          <figcaption><a href="#staff">Staff</a></figcaption>
        </figure>
      </section>
    </article>
  </main>
</body>

</html>
